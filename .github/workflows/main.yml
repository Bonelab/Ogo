name: Python CI

on:
  push:
    branches: [master, ogo-modernization]
  pull_request:
    branches: [master]
  schedule:
    - cron: '0 12 1,15 * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: python-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.os }}, Python 3.12
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15-intel]
    defaults:
      run:
        shell: bash -l {0}
    env:
      MPLBACKEND: Agg
      QT_QPA_PLATFORM: offscreen
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # PBR derives the version from history/tags.
          persist-credentials: false
      - uses: conda-incubator/setup-miniconda@be893c923ea9cf1cf7cd510fbdde27c7e18cbdcb # v4.1.0
        with:
          miniforge-version: 26.7.2-0
          activate-environment: ogo
          environment-file: environment.yml
          channel-priority: strict
          auto-activate-base: false
      # Prove fresh provisioning before considering download caching.
      - name: Install and check development package
        run: |
          python -m pip install -e . "pytest>=7,<10"
          python -m pip check
          python --version
          python -m pip show ogo
          conda list '^(python|numpy|vtk|vtkbone)$'
      - name: Run existing tests and installed-command smoke check
        run: |
          python -m pytest tests -m 'not integration' -ra
